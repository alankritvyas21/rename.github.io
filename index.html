<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Image Renamer Pro</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 30px;
            font-family: Inter, Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at top left,
                    #24324f,
                    #131313 50%);
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            opacity: .7;
            margin-bottom: 25px;
        }

        .dropzone {
            border: 2px dashed #6b7cff;
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: .3s;
            margin-bottom: 20px;
        }

        .dropzone:hover,
        .dropzone.dragover {
            background: rgba(107, 124, 255, .12);
        }

        .dropzone input {
            display: none;
        }

        .dropzone h3 {
            margin-bottom: 10px;
        }

        .dropzone p {
            opacity: .7;
        }

        .file-count {
            color: #8fb3ff;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type=text],
        input[type=number] {
            width: 100%;
            height: 55px;
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 0 16px;
            background: rgba(255, 255, 255, .08);
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, .5);
        }

        .btn {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(
                135deg,
                #6b7cff,
                #8a5cff
            );
            transition: .3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .progress-wrapper {
            margin-top: 20px;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, .1);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                #6b7cff,
                #8a5cff
            );
            transition: width .3s ease;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #8fb3ff;
        }

        .preview {
            margin-top: 25px;
            max-height: 320px;
            overflow-y: auto;
            border-radius: 12px;
            background: rgba(255, 255, 255, .03);
        }

        .preview li {
            list-style: none;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
        }

        .preview li:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>📸 Bulk Image Renamer Pro</h1>
            <div class="subtitle">
                Rename hundreds of images instantly and download as ZIP.
            </div>

            <label class="dropzone" id="dropzone">
                <input type="file" id="files" multiple accept="image/*">

                <h3>Drag & Drop Images</h3>
                <p>or click to browse</p>
            </label>

            <div class="file-count" id="fileCount">
                No files selected
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="prefix"
                    placeholder="Prefix (e.g. MC)">
            </div>

            <div class="input-group">
                <input
                    type="number"
                    id="startNumber"
                    placeholder="Start Number (e.g. 1)">
            </div>

            <button
                class="btn"
                id="renameBtn"
                onclick="renameAndZip()">
                Rename & Download ZIP
            </button>

            <div class="progress-wrapper">
                <div
                    class="progress-bar"
                    id="progressBar">
                </div>
            </div>

            <div class="status" id="status"></div>

            <ul class="preview" id="preview"></ul>

        </div>
    </div>

    <script>

        const filesInput =
            document.getElementById('files');

        const dropzone =
            document.getElementById('dropzone');

        const fileCount =
            document.getElementById('fileCount');

        filesInput.addEventListener(
            'change',
            updateCount
        );

        function updateCount() {
            fileCount.textContent =
                `${filesInput.files.length} image(s) selected`;
        }

        dropzone.addEventListener(
            'dragover',
            (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            }
        );

        dropzone.addEventListener(
            'dragleave',
            () => {
                dropzone.classList.remove('dragover');
            }
        );

        dropzone.addEventListener(
            'drop',
            (e) => {
                e.preventDefault();

                dropzone.classList.remove('dragover');

                filesInput.files =
                    e.dataTransfer.files;

                updateCount();
            }
        );

        async function renameAndZip() {

            const files =
                Array.from(filesInput.files);

            const prefix =
                document.getElementById('prefix')
                    .value.trim();

            const startNumber =
                parseInt(
                    document.getElementById(
                        'startNumber'
                    ).value
                );

            const preview =
                document.getElementById(
                    'preview'
                );

            const progressBar =
                document.getElementById(
                    'progressBar'
                );

            const status =
                document.getElementById(
                    'status'
                );

            const btn =
                document.getElementById(
                    'renameBtn'
                );

            preview.innerHTML = '';

            if (
                files.length === 0 ||
                !prefix ||
                isNaN(startNumber)
            ) {
                alert(
                    'Please select files and fill all fields.'
                );
                return;
            }

            btn.disabled = true;

            files.sort((a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true
                    }
                )
            );

            const zip = new JSZip();

            for (
                let i = 0;
                i < files.length;
                i++
            ) {

                const file = files[i];

                const ext =
                    file.name.split('.').pop();

                const newName =
                    `${prefix} (${startNumber + i}).${ext}`;

                if (i < 20) {
                    preview.innerHTML +=
                        `<li>${newName}</li>`;
                }

                const buffer =
                    await file.arrayBuffer();

                zip.file(
                    newName,
                    buffer
                );

                const progress =
                    ((i + 1) / files.length) * 50;

                progressBar.style.width =
                    progress + '%';

                status.textContent =
                    `Processing ${i + 1} / ${files.length}`;
            }

            status.textContent =
                'Creating ZIP...';

            const blob =
                await zip.generateAsync(
                    {
                        type: 'blob',
                        compression: 'DEFLATE',
                        compressionOptions: {
                            level: 6
                        }
                    },
                    (metadata) => {
                        progressBar.style.width =
                            (50 +
                                metadata.percent / 2)
                            + '%';
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement('a');

            a.href = url;
            a.download =
                'renamed-images.zip';

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

            progressBar.style.width =
                '100%';

            status.textContent =
                `Completed! ${files.length} files renamed and downloaded.`;

            btn.disabled = false;
        }

    </script>

</body>

</html>
