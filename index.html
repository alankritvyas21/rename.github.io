<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Image Renamer</title>
<style>
  :root {
    --bg: #121214;
    --surface: #1b1b1e;
    --surface-2: #232326;
    --border: #333338;
    --text: #f2f0ea;
    --text-dim: #9a9a9f;
    --safelight: #f2b33d;
    --safelight-dim: #7a5c22;
    --teal: #4fb8ac;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-display);
    background:
      radial-gradient(circle at 15% 0%, rgba(242,179,61,0.06), transparent 45%),
      var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 28px;
  }

  h1 {
    font-size: clamp(26px, 6vw, 34px);
    margin: 10px 0 6px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.5;
    max-width: 46ch;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-top: 24px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field:last-of-type {
    margin-bottom: 0;
  }

  label.field-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* file drop zone */
  .dropzone {
    position: relative;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    background: var(--surface-2);
    transition: border-color .15s ease, background .15s ease;
  }

  .dropzone:focus-within,
  .dropzone.has-files {
    border-color: var(--safelight);
    background: rgba(242,179,61,0.06);
  }

  .dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .dz-icon { font-size: 22px; margin-bottom: 6px; }
  .dz-text { font-size: 14px; color: var(--text); }
  .dz-hint { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }

  .row {
    display: flex;
    gap: 14px;
  }

  .row .field { flex: 1; }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 13px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    outline: none;
    transition: border-color .15s ease;
  }

  input[type="text"]::placeholder,
  input[type="number"]::placeholder {
    color: #5c5c62;
  }

  input[type="text"]:focus,
  input[type="number"]:focus {
    border-color: var(--safelight);
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 15px 18px;
    border: none;
    border-radius: 10px;
    background: var(--safelight);
    color: #1a1204;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15.5px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: transform .1s ease, background .15s ease, box-shadow .15s ease;
  }

  button:hover { background: #ffc35c; box-shadow: 0 6px 20px rgba(242,179,61,0.25); }
  button:active { transform: scale(0.98); }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  /* filmstrip preview */
  .filmstrip {
    list-style: none;
    margin: 22px 0 0;
    padding: 0;
    max-height: 320px;
    overflow-y: auto;
    border-radius: 12px;
  }

  .filmstrip:empty { display: none; }

  .frame {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: none;
    border-right: none;
    padding: 10px 18px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    color: var(--text);
    background-image:
      repeating-linear-gradient(180deg, transparent 0 8px, transparent 8px);
  }

  .frame::before,
  .frame::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 16px;
    background-image: radial-gradient(circle, var(--bg) 3px, transparent 3.5px);
    background-size: 100% 14px;
    background-repeat: repeat-y;
    background-position: center 7px;
  }

  .frame::before { left: 0; }
  .frame::after { right: 0; }

  .frame + .frame { border-top: 1px dashed var(--border); }

  .frame .idx {
    color: var(--safelight-dim);
    font-size: 12px;
    min-width: 26px;
    flex-shrink: 0;
  }

  .frame .thumb {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg);
  }

  .frame .names {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .frame .old-name {
    color: #6b6b70;
    font-size: 11.5px;
    text-decoration: line-through;
    text-decoration-color: #4a4a50;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .frame .name {
    color: var(--teal);
    word-break: break-all;
  }

  footer.note {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
  }

  @media (max-width: 420px) {
    .row { flex-direction: column; gap: 0; }
    .card { padding: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bulk Image Renamer</h1>
      <p class="sub">Pick your images, set a prefix and starting number, and download every file relabeled and zipped — like numbering a fresh roll of negatives.</p>
    </header>

    <div class="card">
      <div class="field">
        <label class="field-label" for="files">Images</label>
        <div class="dropzone" id="dropzone">
          <div class="dz-icon">🎞️</div>
          <div class="dz-text">Tap to choose photos</div>
          <div class="dz-hint">or drag files in from your device</div>
          <input type="file" id="files" multiple accept="image/*">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label class="field-label" for="prefix">Prefix</label>
          <input type="text" id="prefix" placeholder="e.g. MC">
        </div>
        <div class="field">
          <label class="field-label" for="startNumber">Start number</label>
          <input type="number" id="startNumber" placeholder="e.g. 24">
        </div>
      </div>

      <button onclick="renameAndZip()">Rename &amp; Download ZIP</button>

      <ul class="filmstrip" id="preview"></ul>
    </div>

    <footer class="note">Everything runs locally in your browser — files never leave your device.</footer>
  </div>

  <!-- JSZip CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    const dropzone = document.getElementById('dropzone');
    const filesInputEl = document.getElementById('files');
    filesInputEl.addEventListener('change', () => {
      dropzone.classList.toggle('has-files', filesInputEl.files.length > 0);
      const dzText = dropzone.querySelector('.dz-text');
      dzText.textContent = filesInputEl.files.length
        ? `${filesInputEl.files.length} file(s) selected`
        : 'Tap to choose photos';
    });

    let activeThumbUrls = [];

    async function renameAndZip() {
      const filesInput = document.getElementById("files");
      const prefix = document.getElementById("prefix").value.trim();
      const startNumber = parseInt(document.getElementById("startNumber").value);
      const preview = document.getElementById("preview");
      preview.innerHTML = "";
      activeThumbUrls.forEach(u => URL.revokeObjectURL(u));
      activeThumbUrls = [];
      if (!filesInput.files.length || !prefix || isNaN(startNumber)) {
        alert("Please select files and fill all inputs.");
        return;
      }
      const zip = new JSZip();
      let counter = startNumber;
      for (const file of filesInput.files) {
        const ext = file.name.split('.').pop();
        const newName = `${prefix} (${counter}).${ext}`;
        const thumbUrl = URL.createObjectURL(file);
        activeThumbUrls.push(thumbUrl);
        preview.innerHTML += `<li class="frame">
          <span class="idx">${String(counter).padStart(3,'0')}</span>
          <img class="thumb" src="${thumbUrl}" alt="">
          <span class="names">
            <span class="old-name">${file.name}</span>
            <span class="name">${newName}</span>
          </span>
        </li>`;
        const arrayBuffer = await file.arrayBuffer();
        zip.file(newName, arrayBuffer);
        counter++;
      }
      const blob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "renamed-images.zip";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
