<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Image Renamer Pro</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #090b10;
            --card: rgba(18, 20, 28, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --muted: #9ca3af;
            --primary: #6d7cff;
            --primary2: #8b5cf6;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left,
                    #1d3557,
                    #0b0d13 40%,
                    #050608 100%);
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--muted);
            font-size: 14px;
        }

        .dropzone {
            position: relative;
            border: 2px dashed rgba(109, 124, 255, 0.6);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .dropzone:hover,
        .dropzone.dragover {
            background: rgba(109, 124, 255, 0.08);
        }

        .dropzone input {
            display: none;
        }

        .dropzone .icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .dropzone h3 {
            margin-bottom: 6px;
        }

        .dropzone p {
            color: var(--muted);
            font-size: 14px;
        }

        .file-count {
            text-align: center;
            color: #9fb4ff;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            height: 56px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            color: white;
            padding: 0 16px;
            outline: none;
            font-size: 15px;
        }

        input::placeholder {
            color: #8b93a7;
        }

        .btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary2)
            );
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .progress-wrapper {
            margin-top: 18px;
            height: 10px;
            background: rgba(255,255,255,.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                var(--primary),
                var(--primary2)
            );
            transition: width .3s ease;
        }

        .status {
            margin-top: 10px;
            text-align: center;
            color: #9fb4ff;
            font-size: 13px;
        }

        .preview {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 14px;
            background: rgba(255,255,255,.03);
            border: 1px solid var(--border);
        }

        .preview li {
            list-style: none;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,.05);
            word-break: break-word;
            font-size: 14px;
        }

        .preview li:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 18px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 13px;
            }

            .dropzone {
                padding: 28px 14px;
            }

            .dropzone .icon {
                font-size: 36px;
            }

            .dropzone h3 {
                font-size: 18px;
            }

            .dropzone p {
                font-size: 13px;
            }

            input[type="text"],
            input[type="number"],
            .btn {
                height: 52px;
                font-size: 16px;
            }

            .preview {
                max-height: 220px;
            }

            .preview li {
                font-size: 13px;
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">
                <h1>📸 Bulk Image Renamer</h1>
                <p>Rename hundreds of images and download them as a ZIP</p>
            </div>

            <label class="dropzone" id="dropzone">

                <input
                    type="file"
                    id="files"
                    multiple
                    accept="image/*">

                <div class="icon">📁</div>

                <h3>Drag & Drop Images</h3>

                <p>or tap here to browse</p>

            </label>

            <div class="file-count" id="fileCount">
                No files selected
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="prefix"
                    placeholder="Prefix (Example: MC)">
            </div>

            <div class="input-group">
                <input
                    type="number"
                    id="startNumber"
                    placeholder="Start Number (Example: 1)">
            </div>

            <button
                class="btn"
                id="renameBtn"
                onclick="renameAndZip()">
                Rename & Download ZIP
            </button>

            <div class="progress-wrapper">
                <div
                    class="progress-bar"
                    id="progressBar">
                </div>
            </div>

            <div class="status" id="status"></div>

            <ul class="preview" id="preview"></ul>

        </div>

    </div>

    <script>

        const fileInput =
            document.getElementById("files");

        const fileCount =
            document.getElementById("fileCount");

        const dropzone =
            document.getElementById("dropzone");

        fileInput.addEventListener(
            "change",
            updateCount
        );

        function updateCount() {

            const total =
                fileInput.files.length;

            fileCount.textContent =
                total === 0
                    ? "No files selected"
                    : `${total} image(s) selected`;
        }

        dropzone.addEventListener(
            "dragover",
            (e) => {
                e.preventDefault();
                dropzone.classList.add("dragover");
            }
        );

        dropzone.addEventListener(
            "dragleave",
            () => {
                dropzone.classList.remove("dragover");
            }
        );

        dropzone.addEventListener(
            "drop",
            (e) => {

                e.preventDefault();

                dropzone.classList.remove(
                    "dragover"
                );

                fileInput.files =
                    e.dataTransfer.files;

                updateCount();
            }
        );

        async function renameAndZip() {

            const files =
                Array.from(fileInput.files);

            const prefix =
                document
                    .getElementById("prefix")
                    .value.trim();

            const startNumber =
                parseInt(
                    document.getElementById(
                        "startNumber"
                    ).value
                );

            const preview =
                document.getElementById(
                    "preview"
                );

            const progressBar =
                document.getElementById(
                    "progressBar"
                );

            const status =
                document.getElementById(
                    "status"
                );

            const button =
                document.getElementById(
                    "renameBtn"
                );

            preview.innerHTML = "";

            if (
                !files.length ||
                !prefix ||
                isNaN(startNumber)
            ) {
                alert(
                    "Please select images and fill all fields."
                );
                return;
            }

            button.disabled = true;

            files.sort((a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    { numeric: true }
                )
            );

            const zip = new JSZip();

            for (
                let i = 0;
                i < files.length;
                i++
            ) {

                const file = files[i];

                const extension =
                    file.name.split(".").pop();

                const newName =
                    `${prefix} (${startNumber + i}).${extension}`;

                if (i < 20) {
                    preview.innerHTML +=
                        `<li>${newName}</li>`;
                }

                zip.file(
                    newName,
                    await file.arrayBuffer()
                );

                const progress =
                    ((i + 1) /
                        files.length) * 50;

                progressBar.style.width =
                    progress + "%";

                status.textContent =
                    `Processing ${i + 1} of ${files.length}`;
            }

            status.textContent =
                "Creating ZIP...";

            const blob =
                await zip.generateAsync(
                    {
                        type: "blob",
                        compression: "DEFLATE",
                        compressionOptions: {
                            level: 6
                        }
                    },
                    (metadata) => {

                        progressBar.style.width =
                            (50 +
                                metadata.percent / 2)
                            + "%";
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;
            a.download =
                "renamed-images.zip";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

            progressBar.style.width =
                "100%";

            status.textContent =
                `Completed! ${files.length} images renamed.`;

            button.disabled = false;
        }

    </script>

</body>

    </html>
