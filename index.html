<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulk Image Renamerv2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      padding: 30px;
    }
    input, button {
      padding: 10px;
      margin: 8px 0;
      width: 100%;
      max-width: 400px;
    }
    button {
      cursor: pointer;
      background: #4caf50;
      border: none;
      color: white;
      font-weight: bold;
    }
    ul {
      margin-top: 20px;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <h2>📸 Bulk Image Renamer</h2>

  <input type="file" id="files" multiple accept="image/*">

  <input type="text" id="prefix" placeholder="Prefix (e.g. MC)">

  <input type="number" id="startNumber" placeholder="Start Number (e.g. 24)">

  <button onclick="renameAndZip()">Rename & Download ZIP</button>

  <ul id="preview"></ul>

  <!-- JSZip CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    async function renameAndZip() {
      const filesInput = document.getElementById("files");
      const prefix = document.getElementById("prefix").value.trim();
      const startNumber = parseInt(document.getElementById("startNumber").value);
      const preview = document.getElementById("preview");

      preview.innerHTML = "";

      if (!filesInput.files.length || !prefix || isNaN(startNumber)) {
        alert("Please select files and fill all inputs.");
        return;
      }

      const zip = new JSZip();
      let counter = startNumber;

      for (const file of filesInput.files) {
        const ext = file.name.split('.').pop();
        const newName = `${prefix} (${counter}).${ext}`;

        preview.innerHTML += `<li>${newName}</li>`;

        const arrayBuffer = await file.arrayBuffer();
        zip.file(newName, arrayBuffer);

        counter++;
      }

      const blob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "renamed-images.zip";
      a.click();

      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
