<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Image Renamer</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left,
                    #16213e,
                    #0a0f1f 45%,
                    #05070d);
            color: #fff;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: rgba(12, 17, 30, .92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px;
            padding: 20px;
            box-shadow:
                0 20px 40px rgba(0,0,0,.35);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #9ea6bc;
            font-size: 14px;
        }

        .upload-box {
            border: 2px dashed rgba(123, 138, 255, .5);
            border-radius: 18px;
            background: rgba(255,255,255,.03);
            text-align: center;
            padding: 24px 16px;
            cursor: pointer;
            transition: .3s;
        }

        .upload-box:hover {
            background: rgba(123,138,255,.08);
        }

        .upload-box.dragover {
            background: rgba(123,138,255,.12);
            border-color: #7b8aff;
        }

        .upload-box input {
            display: none;
        }

        .upload-icon {
            font-size: 52px;
            margin-bottom: 10px;
        }

        .upload-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .upload-subtitle {
            color: #9ea6bc;
            font-size: 14px;
        }

        .file-count {
            text-align: center;
            color: #a9b7ff;
            font-weight: 600;
            margin: 16px 0;
        }

        .input-group {
            margin-bottom: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.04);
            color: white;
            padding: 0 16px;
            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #8f98ae;
        }

        .btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #8b5cf6
                );
        }

        .progress-wrapper {
            margin-top: 16px;
            height: 8px;
            background: rgba(255,255,255,.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background:
                linear-gradient(
                    90deg,
                    #667eea,
                    #8b5cf6
                );
            transition: .3s;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            color: #a9b7ff;
            font-size: 13px;
        }

        .preview {
            margin-top: 18px;
            border-radius: 14px;
            overflow: hidden;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,.08);
        }

        .preview li {
            list-style: none;
            padding: 12px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,.05);
            word-break: break-word;
        }

        .preview li:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .header h1 {
                font-size: 22px;
            }

            .upload-icon {
                font-size: 42px;
            }

            .upload-title {
                font-size: 18px;
            }

            .upload-box {
                padding: 20px 12px;
            }

            input[type="text"],
            input[type="number"],
            .btn {
                height: 50px;
            }

            .preview {
                max-height: 180px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>📸 Bulk Image Renamer</h1>
            <p>Rename hundreds of images and download as ZIP</p>
        </div>

        <label class="upload-box" id="dropzone">

            <input
                type="file"
                id="files"
                multiple
                accept="image/*">

            <div class="upload-icon">📁</div>

            <div class="upload-title">
                Select Images
            </div>

            <div class="upload-subtitle">
                Tap to browse or drag & drop
            </div>

        </label>

        <div
            class="file-count"
            id="fileCount">
            No files selected
        </div>

        <div class="input-group">
            <input
                type="text"
                id="prefix"
                placeholder="Prefix (Example: MC)">
        </div>

        <div class="input-group">
            <input
                type="number"
                id="startNumber"
                placeholder="Start Number (Example: 1)">
        </div>

        <button
            class="btn"
            id="renameBtn"
            onclick="renameAndZip()">
            Rename & Download ZIP
        </button>

        <div class="progress-wrapper">
            <div
                class="progress-bar"
                id="progressBar">
            </div>
        </div>

        <div
            class="status"
            id="status">
        </div>

        <ul
            class="preview"
            id="preview">
        </ul>

    </div>

</div>

<script>

const fileInput =
    document.getElementById("files");

const fileCount =
    document.getElementById("fileCount");

const dropzone =
    document.getElementById("dropzone");

fileInput.addEventListener(
    "change",
    updateCount
);

function updateCount() {

    fileCount.textContent =
        `${fileInput.files.length} image(s) selected`;
}

dropzone.addEventListener(
    "dragover",
    (e) => {

        e.preventDefault();

        dropzone.classList.add(
            "dragover"
        );
    }
);

dropzone.addEventListener(
    "dragleave",
    () => {

        dropzone.classList.remove(
            "dragover"
        );
    }
);

dropzone.addEventListener(
    "drop",
    (e) => {

        e.preventDefault();

        dropzone.classList.remove(
            "dragover"
        );

        fileInput.files =
            e.dataTransfer.files;

        updateCount();
    }
);

async function renameAndZip() {

    const files =
        Array.from(fileInput.files);

    const prefix =
        document.getElementById(
            "prefix"
        ).value.trim();

    const startNumber =
        parseInt(
            document.getElementById(
                "startNumber"
            ).value
        );

    if (
        !files.length ||
        !prefix ||
        isNaN(startNumber)
    ) {
        alert(
            "Please fill all fields."
        );
        return;
    }

    const preview =
        document.getElementById(
            "preview"
        );

    const progressBar =
        document.getElementById(
            "progressBar"
        );

    const status =
        document.getElementById(
            "status"
        );

    preview.innerHTML = "";

    const zip = new JSZip();

    files.sort((a,b)=>
        a.name.localeCompare(
            b.name,
            undefined,
            {numeric:true}
        )
    );

    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        const file =
            files[i];

        const ext =
            file.name.split(".").pop();

        const newName =
            `${prefix} (${startNumber + i}).${ext}`;

        if (i < 20) {
            preview.innerHTML +=
                `<li>${newName}</li>`;
        }

        zip.file(
            newName,
            await file.arrayBuffer()
        );

        progressBar.style.width =
            ((i + 1) /
            files.length * 50)
            + "%";

        status.textContent =
            `Processing ${i + 1} of ${files.length}`;
    }

    const blob =
        await zip.generateAsync(
            {
                type: "blob",
                compression: "DEFLATE"
            },
            (meta) => {

                progressBar.style.width =
                    (50 +
                    meta.percent / 2)
                    + "%";
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download =
        "renamed-images.zip";

    a.click();

    URL.revokeObjectURL(url);

    progressBar.style.width =
        "100%";

    status.textContent =
        "Download Complete";
}

</script>

</body>
</html>
